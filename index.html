<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c2050" />
    <title>Kurnool Chaos</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="status" class="loading"><p>Loading Kurnool…</p></div>
    <div id="fps" hidden></div>
    <div id="toast" hidden></div>
    <div id="chaospop"></div>
    <div id="mapbox" hidden>
      <canvas id="minimap" aria-label="City map: tap to zoom"></canvas>
      <div id="heat" role="img" aria-label="Police heat 0 of 3"><i></i><i></i><i></i></div>
      <div id="chaos" hidden title="Chaos points">💥 <b>0</b></div>
    </div>
    <div id="spd" hidden><b id="kmh">0</b><span>km/h</span></div>
    <div id="stick"><div id="knob"></div></div>
    <div id="btns">
      <button id="bUnstuck" type="button">Unstuck</button>
      <button id="bHorn" type="button">Horn</button>
      <button id="bBoost" type="button">Boost</button>
      <button id="bHand" type="button">Run</button>
      <button id="bAct" type="button">Get in</button>
    </div>
    <div id="hint" hidden>Drag to move · right-drag or two fingers to turn · scroll or pinch to zoom · WASD, Q/E, R/F</div>
    <div id="credit">© OpenStreetMap contributors, Overture Maps Foundation, Google Open Buildings, Dynamic World, Copernicus DEM</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
